name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  suite:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests
      - run: python3 tools/check_public.py v0.1.0
      - run: python3 tools/check_public.py v0.2.0
      - run: python3 tools/check_public.py HEAD
  verify:
    runs-on: ubuntu-latest
    needs: suite
    if: ${{ always() }}
    steps:
      - env:
          SUITE_RESULT: ${{ needs.suite.result }}
        run: test "$SUITE_RESULT" = success
