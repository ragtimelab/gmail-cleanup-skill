name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s tests
      - run: python3 tools/check_public.py v0.1.0
      - run: python3 tools/check_public.py v0.2.0
      - run: python3 tools/check_public.py HEAD
